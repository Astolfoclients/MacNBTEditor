<!DOCTYPE html>
<html>
<head>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #1e1e1e;
      color: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      height: 100vh;
      margin: 0;
      padding: 20px;
      box-sizing: border-box;
    }
    .header-container {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
    }
    button {
      background-color: #4a90e2;
      color: white;
      border: none;
      padding: 10px 20px;
      font-size: 0.95rem;
      font-weight: bold;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.2s;
    }
    button:hover { background-color: #357abd; }
    button:disabled { background-color: #555555; cursor: not-allowed; }
    #save-btn { background-color: #2ecc71; }
    #save-btn:hover { background-color: #27ae60; }
    #editor {
      width: 100%;
      flex-grow: 1;
      background-color: #121212;
      color: #00ff66;
      font-family: "Courier New", Courier, monospace;
      font-size: 0.9rem;
      padding: 15px;
      border: 1px solid #333;
      border-radius: 8px;
      resize: none;
      outline: none;
      box-sizing: border-box;
    }
    #status {
      margin-top: 10px;
      font-weight: bold;
      color: #a0a0a0;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>

  <div class="header-container">
    <h2 style="margin: 0;">Universal NBT Editor</h2>
    <div style="display: flex; gap: 10px;">
      <button id="select-btn">Open File</button>
      <button id="save-btn" disabled>Save Changes</button>
    </div>
  </div>

  <textarea id="editor" placeholder="// Select a level.dat file to populate NBT data data structures..."></textarea>
  <div id="status">Ready for file selection...</div>

  <script>
    const { ipcRenderer } = require('electron');
    const selectBtn = document.getElementById('select-btn');
    const saveBtn = document.getElementById('save-btn');
    const editor = document.getElementById('editor');
    const statusText = document.getElementById('status');

    selectBtn.addEventListener('click', () => {
      statusText.innerText = "Opening file picker...";
      ipcRenderer.send('open-file-dialog');
    });

    saveBtn.addEventListener('click', () => {
      statusText.innerText = "Saving and re-compressing NBT raw data stream...";
      ipcRenderer.send('save-file-changes', editor.value);
    });

    ipcRenderer.on('file-loaded', (event, jsonData) => {
      editor.value = jsonData;
      saveBtn.disabled = false;
      statusText.innerText = "File loaded successfully! Edit values above.";
    });

    ipcRenderer.on('status', (event, message) => {
      statusText.innerText = message;
    });
  </script>
</body>
</html>
